name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: photoframe_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # SQLite tests always run. The Postgres contract tests run when
      # TEST_POSTGRES_URL is set, so this one invocation covers both backends.
      - run: cargo test
        env:
          TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/photoframe_test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  # Drives the real binaries in real browsers: gestures, the login flow,
  # rotation, upload, delete, export and the offline cache.
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p photoframe-web -p photoframe-indexer
        working-directory: .
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Debug builds of photoframe-web read web/dist from disk at runtime.
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results

  # Only publishes once rust, web and e2e have all passed, so a broken build
  # never reaches :latest.
  image:
    needs: [rust, web, e2e]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [web, indexer]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          # amd64 only; add linux/arm64 when a cluster node needs it.
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/photoframe-${{ matrix.target }}:${{ steps.meta.outputs.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/photoframe-${{ matrix.target }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Publishes the chart as an OCI artifact alongside the images, so a cluster
  # already configured for ghcr.io needs no separate chart repo.
  helm:
    needs: [rust, web, e2e]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: helm lint helm-charts/photoframe --set image.registry=x --set admin.password=x
      - id: meta
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - run: |
          helm package helm-charts/photoframe --destination .
          helm push photoframe-*.tgz "oci://ghcr.io/${{ steps.meta.outputs.owner }}/charts"
