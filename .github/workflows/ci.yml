name: ci
on:
  # Branches are tested through their PR; pushing to main is what releases.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: photoframe_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # SQLite tests always run. The Postgres contract tests run when
      # TEST_POSTGRES_URL is set, so this one invocation covers both backends.
      - run: cargo test
        env:
          TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/photoframe_test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  # Drives the real binaries in real browsers: gestures, the login flow,
  # rotation, upload, delete, export and the offline cache.
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      # web/dist must exist before this: rust-embed's #[derive(RustEmbed)]
      # canonicalizes the folder path at compile time for its path-traversal
      # check, and silently falls back to an unresolved path (breaking that
      # check for every request) if the folder doesn't exist yet.
      - run: cargo build -p photoframe-web -p photoframe-indexer
        working-directory: .
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results

  # Lints on every PR; publishing is too late to find a broken chart.
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      - run: helm lint helm-charts/photoframe --set image.registry=x --set admin.password=x

  # release-please keeps one release PR open with the next version, the
  # changelog and the Chart.yaml bump. Merging it tags vX.Y.Z and sets
  # release_created, the only thing that publishes images or the chart. It
  # runs after the tests, so a red main can't cut a release.
  release:
    needs: [rust, web, e2e, chart]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          # GitHub runs no workflows for a PR opened with GITHUB_TOKEN, so the
          # release PR's required checks would never report and it couldn't
          # merge. A PAT's PRs get CI like any other; GITHUB_TOKEN is only the
          # fallback until the secret exists.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  # Hangs off the release job's output rather than a tag push: the tag is
  # created with a token whose events don't start workflows.
  image:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [web, indexer]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          # amd64 only; add linux/arm64 when a cluster node needs it.
          platforms: linux/amd64
          # The chart's appVersion is the release version, so that tag is the
          # one deployments use; sha and latest are for pulling by hand.
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/photoframe-${{ matrix.target }}:${{ needs.release.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/photoframe-${{ matrix.target }}:${{ steps.meta.outputs.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/photoframe-${{ matrix.target }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Publishes the chart as an OCI artifact alongside the images, so a cluster
  # already configured for ghcr.io needs no separate chart repo. Waits for
  # both images: a cluster following new chart versions would otherwise
  # install one whose images aren't pushed yet.
  helm:
    needs: [release, image]
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      # Versions passed explicitly as well as bumped in Chart.yaml, so the
      # published chart always matches the image tags it points at.
      - run: |
          helm package helm-charts/photoframe --destination . --version "$VERSION" --app-version "$VERSION"
          helm push "photoframe-$VERSION.tgz" "oci://ghcr.io/${{ steps.meta.outputs.owner }}/charts"
        env:
          VERSION: ${{ needs.release.outputs.version }}
