{{- include "photoframe.validate" . -}}
{{- if eq .Values.database.type "sqlite" }}
{{- /* One pod, two containers: the only supported SQLite topology. */ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "photoframe.name" . }}
  labels: {{- include "photoframe.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "photoframe.selector" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "photoframe.selector" (dict "root" . "component" "web") | nindent 8 }}
      {{- with .Values.web.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.indexer.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        {{- include "photoframe.webContainer" . | nindent 8 }}
        {{- include "photoframe.indexerContainer" . | nindent 8 }}
      volumes:
        {{- include "photoframe.volumes" . | nindent 8 }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- else }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "photoframe.name" . }}-web
  labels: {{- include "photoframe.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  strategy:
    type: RollingUpdate
  selector:
    matchLabels: {{- include "photoframe.selector" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "photoframe.selector" (dict "root" . "component" "web") | nindent 8 }}
      {{- with .Values.web.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        {{- include "photoframe.webContainer" . | nindent 8 }}
      volumes:
        {{- include "photoframe.volumes" . | nindent 8 }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
---
# Exactly one replica, Recreate: two indexers would race on promotion and derivatives.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "photoframe.name" . }}-indexer
  labels: {{- include "photoframe.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "photoframe.selector" (dict "root" . "component" "indexer") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "photoframe.selector" (dict "root" . "component" "indexer") | nindent 8 }}
      {{- with .Values.indexer.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.indexer.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        {{- include "photoframe.indexerContainer" . | nindent 8 }}
      volumes:
        {{- include "photoframe.volumes" . | nindent 8 }}
      {{- with .Values.indexer.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.indexer.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.indexer.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
