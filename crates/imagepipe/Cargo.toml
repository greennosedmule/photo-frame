[package]
name = "imagepipe"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Untrusted-input surface: safe Rust only, no C dependencies, no I/O.
# Format crates (zune-jpeg, image, heic-rs, ...) are added alongside their Decoder impls.
[dependencies]
fast_image_resize = "6.1.0"
heic-rs = "0.1.1"
image = { version = "0.25.10", default-features = false, features = ["png", "webp"] }
jpeg-encoder = "0.7.1"
kamadak-exif = "0.6.1"
thiserror.workspace = true
zune-core = "0.5.3"
zune-jpeg = "0.5.15"

[lints]
workspace = true
