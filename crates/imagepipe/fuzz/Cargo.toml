doc = false
bench = false

[[bin]]
name = "inspect"
path = "fuzz_targets/inspect.rs"
test = false
doc = false
bench = false

[[bin]]
name = "derive"
path = "fuzz_targets/derive.rs"
test = false
doc = false
bench = false

[workspace]
