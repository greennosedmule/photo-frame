[package]
name = "imagepipe-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
imagepipe = { path = ".." }

[[bin]]
name = "sniff"
path = "fuzz_targets/sniff.rs"
